body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}

nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:0;z-index:5}

main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:17px;margin:0 0 4px}

button.b{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer}
button.b:hover{background:#eef2fb}
button.pri{background:var(--brand2);color:#fff;border-color:var(--brand2)}
button.pri:hover{background:var(--brand)}
button.ok{background:#e8f5e9;border-color:#a5d6a7}
button.no{background:#fdecea;border-color:#ef9a9a}
button.sel{background:var(--brand2);color:#fff;border-color:var(--brand2)}
input,select,textarea{font:inherit;border:1px solid #cfd5e3;border-radius:7px;padding:6px 8px;background:#fff}
textarea{width:100%}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}

const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const dayDiff=(a,b)=>Math.round((a-b)/864e5);
function pd(s){ if(!s)return null; s=String(s).trim(); if(!s)return null;
  let m=s.match(/^(\d{4})[-./\s]*(\d{1,2})[-./\s]*(\d{1,2})/); if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d; }
function toast(t,undo){const e=$("#toast");e.innerHTML=esc(t)+(undo?` <button class="b" style="padding:2px 8px;margin-left:8px" id="undoBtn">되돌리기</button>`:"");
  e.style.display="block"; if(undo)$("#undoBtn").onclick=()=>{undo();e.style.display="none";};
  clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display="none",undo?5000:2200);}
function copy(text){ const done=()=>toast("복사했습니다. 카톡·문자에 붙여넣기 하세요");
  if(navigator.clipboard&&window.isSecureContext!==false){navigator.clipboard.writeText(text).then(done).catch(()=>fb());}else fb();
  function fb(){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){toast("복사 실패: 직접 선택해서 복사하세요");}t.remove();} }
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:type||"text/plain"}));a.download=name;a.click();}

/* ================= 분류 로직 ================= */
function enrich(){
  const T=today(), st=S.set;
  const lastLog={}, cnt={};
  S.logs.forEach(l=>{const d=pd(l.date); if(!d)return; cnt[l.name]=(cnt[l.name]||0)+1; if(!lastLog[l.name]||d>lastLog[l.name])lastLog[l.name]=d;});
  return S.customers.map((c,i)=>{
    const b=pd(c.birth), g=pd(c.start), lc0=pd(c.last);
    const age=b?Math.floor(dayDiff(T,b)/365.25):null;
    const years=g?Math.round(dayDiff(T,g)/365.25*10)/10:null;
    let last=lc0; const ll=lastLog[c.name]; if(ll&&(!last||ll>last))last=ll;
    const prem=Number(String(c.premium||"0").replace(/[^\d.]/g,""))||0;
    const prod=c.products||"";
    let type,reason;
    if(st.urgent.includes(c.status)||(c.note&&c.note.trim())){type="A";reason=st.urgent.includes(c.status)?`납입상태 ${c.status}`:`특이사항: ${c.note}`;}
    else if(c.status===st.paidWord||(age!=null&&age>=st.elder)){type="D";reason=c.status===st.paidWord?"완납":`${age}세 고령`;}
    else if(prem<=st.small&&!st.keywords.some(k=>k&&prod.includes(k))){type="C";reason=`월 ${prem.toLocaleString()}원, 종합보장 없음`;}
    else if(age!=null&&age>=st.bMin&&age<=st.bMax&&years!=null&&years>=st.bYears){type="B";reason=`${age}세, 가입 ${years}년`;}
    else {type="E";reason="해당 타입 없음";}
    const daysSince=last?dayDiff(T,last):null;
    const resting=daysSince!=null&&daysSince<st.cool;
    return Object.assign({},c,{i,age,years,last,prem,type,reason,daysSince,resting,cnt:cnt[c.name]||0});
  });
}
function fill(t,c){return t.replace(/\{고객명\}/g,c.name).replace(/\{FC\}/g,S.set.fc);}
function sortToday(list){
  return list.filter(c=>!c.resting).sort((a,b)=>TYPES[a.type].rank-TYPES[b.type].rank||
    (b.daysSince==null?1e9:b.daysSince)-(a.daysSince==null?1e9:a.daysSince)||a.i-b.i);
}

function addLog(o){
  const l=Object.assign({id:newId(),date:fmt(today()),report:"",link:"",next:"",memo:"",synced:false,cat:new Date().toISOString()},o);
  const c=enrich().find(x=>x.name===l.name); l.type=c?c.type:"E"; l.code=codeFor(l.name);
  S.logs.push(l);save();syncSoon();return l;
}
function removeLog(id){
  const l=S.logs.find(x=>String(x.id)===String(id)); if(!l)return false;
  if(l.synced&&SERVER){ // 서버는 올라간 지 2일 이내의 본인 기록만 삭제 허용
    const ref=l.cat?new Date(l.cat):pd(l.date);
    if(ref&&Date.now()-ref>2*864e5){toast("서버에 올라간 지 2일이 지난 기록은 삭제할 수 없습니다");return false;}
  }
  S.logs=S.logs.filter(x=>String(x.id)!==String(id)); save();
  if(l.synced&&SERVER)queueDelete(l.id);
  return true;
}

function weekStart(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;}
function statRange(from,to,all){
  const a=fmt(from), b=fmt(to); const ls=S.logs.filter(l=>l.date>=a&&l.date<=b);
  const typeOf=n=>(all.find(c=>c.name===n)||{}).type;
  const f=(arr)=>({n:arr.length,callmeet:arr.filter(l=>l.method!=="문자").length,meet:arr.filter(l=>l.method==="미팅").length,
    ok:arr.filter(l=>l.result==="O").length,report:arr.filter(l=>l.report==="Y").length,link:arr.filter(l=>l.link).length});
  return {all:f(ls),by:k=>f(ls.filter(l=>typeOf(l.name)===k))};
}

function coachItems(all){

  const r=statRange(s,e,all), t=r.all, items=[], pc=(a,b)=>Math.round(a/b*100)+"%";
  const aWait=all.filter(c=>c.type==="A"&&c.cnt===0);
  if(aWait.length) items.push({lv:"high",title:`긴급(A) 고객 ${aWait.length}명에게 아직 연락한 기록이 없습니다`,why:aWait.slice(0,5).map(c=>c.name).join(", ")+(aWait.length>5?" 외":""),msg:COACH_AWAIT});

    if(x.n>=3&&x.ok/x.n<0.3) items.push({lv:"mid",title:`${k}타입(${TYPES[k].name}) 첫 연락 반응이 낮습니다`,why:`최근 14일 접촉 ${x.n}건 중 반응 ${x.ok}건 (${pc(x.ok,x.n)})`,msg:COACH_LOW[k]});});

  if(t.report>=3&&t.link===0) items.push({lv:"mid",title:"리포트는 나갔는데 계약·소개 연결이 없습니다",why:`최근 14일 리포트 ${t.report}건, 연결 0건`,msg:COACH_LINK});
  if(all.some(c=>!c.resting)&&t.n<5) items.push({lv:"low",title:"최근 2주 접촉 건수가 적습니다",why:`최근 14일 접촉 ${t.n}건`,msg:COACH_ACT});

function parsePaste(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim()); if(!lines.length)return [];
  const split=l=>l.includes("\t")?l.split("\t"):l.split(",");
  let rows=lines.map(split).map(r=>r.map(x=>x.trim().replace(/^"|"$/g,"")));
  const map={name:0,birth:1,gender:2,products:3,premium:4,status:5,start:6,last:7,note:8};
  if(rows[0].some(x=>x.includes("고객명")||x.includes("성명")||x==="이름")){
    const h=rows.shift(); const find=(...ks)=>h.findIndex(x=>ks.some(k=>x.includes(k)));
    const m2={name:find("고객명","성명","이름"),birth:find("생년","생일"),gender:find("성별"),products:find("상품","보종"),premium:find("월납","보험료"),
      status:find("납입상태","상태","연체"),start:find("가입일","계약일"),last:find("마지막","최근"),note:find("특이","비고")};
    Object.keys(m2).forEach(k=>{if(m2[k]>=0)map[k]=m2[k]; else if(k!=="name")map[k]=-1;});
  }
  return rows.filter(r=>r[map.name]).map(r=>{const g=k=>map[k]>=0?(r[map[k]]||""):"";
    const nz=s=>{const d=pd(s);return d?fmt(d):"";};
    return {name:g("name"),birth:nz(g("birth")),gender:g("gender"),products:g("products"),premium:g("premium"),status:g("status"),start:nz(g("start")),last:nz(g("last")),note:g("note")};});
}

function addLead(){
  stage4(); const name=$("#ld-name").value.trim(); if(!name){toast("고객명을 입력하세요");return;}
  S.leads.push({id:String(Date.now()),name,src:$("#ld-src").value,recv:$("#ld-recv").value,consent:$("#ld-consent").checked,memo:$("#ld-memo").value.trim(),stage:0,next:"",first:""});
  save(); $("#ld-name").value="";$("#ld-memo").value=""; leadList(); toast("접수 등록했습니다");
}
function leadList(){
  stage4(); const st=DBD.db.stages, T=fmt(today());
  const ls=[...S.leads].sort((a,b)=>(a.stage>=6)-(b.stage>=6)||(a.next||"9").localeCompare(b.next||"9"));
  $("#ld-list").innerHTML=ls.length?`<div class="tw"><table><tr><th>고객</th><th>경로</th><th>접수</th><th>단계</th><th>다음 연락일</th><th>메모</th><th></th></tr>
  ${ls.map(l=>{const done=l.stage>=6; const mins=l.recv?Math.round((Date.now()-new Date(l.recv))/6e4):null;
    const late=!done&&l.stage===0&&mins!=null&&mins>5; const due=!done&&l.next&&l.next<=T;
    return `<tr style="${due?"background:#fff8e1":""}"><td><b>${esc(l.name)}</b>${l.consent?"":` <span class="badge tA">동의 확인 필요</span>`}</td><td>${esc(l.src)}</td>
    <td class="small">${esc((l.recv||"").replace("T"," "))}${late?`<br><span style="color:var(--bad)"><b>첫 연락 ${mins>=60?Math.floor(mins/60)+"시간 ":""}${mins%60}분 경과</b></span>`:""}</td>
    <td>${done?"✅ 완료":`<select onchange="updLead('${l.id}','stage',+this.value)">${st.map((s,i)=>`<option value="${i}" ${i===l.stage?"selected":""}>${esc(s.name)}</option>`).join("")}<option value="6">완료</option></select>`}</td>
    <td><input type="date" value="${esc(l.next)}" onchange="updLead('${l.id}','next',this.value)">${due?` <span class="badge tB">오늘 할 일</span>`:""}</td>
    <td><input value="${esc(l.memo)}" style="width:150px" onchange="updLead('${l.id}','memo',this.value)"></td>
    <td><div class="row">${!done?`<button class="b" onclick="advLead('${l.id}')">다음 단계 ▶</button>`:""}${!done&&st[l.stage].script?`<button class="b" onclick="copy(${esc(JSON.stringify(fillFC(st[l.stage].script).replace("○○",l.name)))})">📋</button>`:""}<button class="b" onclick="delLead('${l.id}')">삭제</button></div></td></tr>`;}).join("")}</table></div>`:`<div class="card empty">접수된 고객이 없습니다.</div>`;
}
function updLead(id,f,v){const l=S.leads.find(x=>x.id===id); if(l){l[f]=v; if(f==="stage"&&v>0&&!l.first)l.first=fmt(today());} save(); leadList();}
function advLead(id){const l=S.leads.find(x=>x.id===id); if(!l)return; l.stage=Math.min(6,l.stage+1); save(); leadList();}
function delLead(id){if(confirm("이 접수를 삭제할까요?")){S.leads=S.leads.filter(x=>x.id!==id);save();leadList();}}

   <div><label class="f">대표 나이</label><input id="co-age" type="number" style="width:100%" value="${esc(d.age||"")}"></div>

   <div><label class="f">가지급금</label><select id="co-loan" style="width:100%">${sel(["모름","있음","없음"],d.loan)}</select></div>

function vCorp(){

function corpSaved(){

function saveCorp(){const d=corpRead(); if(!d.name){toast("회사명을 입력하세요");return;} stage4(); d.id=d.id||String(Date.now()); d.saved=fmt(today());
  const i=S.corp.findIndex(x=>x.id===d.id); if(i>=0)S.corp[i]=d; else S.corp.push(d); CORP_ID=d.id; save(); corpSaved(); toast("저장했습니다");}
function loadCorp(id){const d=S.corp.find(x=>x.id===id); if(!d)return; CORP_ID=id; $("#co-form").innerHTML=corpForm(d); $("#co-out").innerHTML=""; window.scrollTo(0,0);}

function delCorp(id){if(confirm("이 고객사를 삭제할까요?")){S.corp=S.corp.filter(x=>x.id!==id);if(CORP_ID===id)CORP_ID=null;save();corpSaved();}}

function corpScore(d){
  const yr=new Date().getFullYear(), age=+d.age||0, staff=+d.staff||0, comp=d.year?yr-(+d.year):0, ind=DBD.industries.find(i=>i.name===d.ind)||{risk:false,hook:""};
  const has=k=>d.has.includes(k), bigSales=["50~100억","100억 이상"].includes(d.sales);
  const out={};
  const add=(k,s,r)=>{out[k]=out[k]||{s:0,r:[]}; out[k].s+=s; if(r)out[k].r.push(r);};
  add("ceo",2); if(!has("ceo"))add("ceo",3,"대표 보장 가입이 확인되지 않음"); if(age>=60)add("ceo",2,`대표 나이 ${age}세`); else if(age>=50)add("ceo",1,`대표 나이 ${age}세`); if(d.succ==="미정")add("ceo",1,"후계 구도 미정");
  add("retire",1); if(!has("retire"))add("retire",3,"퇴직금 재원 준비가 확인되지 않음"); if(staff>=10)add("retire",1,`직원 ${staff}명`); if(comp>=10)add("retire",1,`설립 ${comp}년차`);
  if(staff>=5){add("group",2,`직원 ${staff}명`); if(!has("group"))add("group",3,"단체보험 가입이 확인되지 않음");}
  if(d.assets.length){add("property",2,`보유 자산: ${d.assets.join(", ")}`); if(!has("property"))add("property",3,"화재·재물보험 가입이 확인되지 않음");}
  add("liab",1); if(ind.risk)add("liab",2,`${d.ind}은 사고·배상 이슈가 잦은 업종`); if(!has("liab"))add("liab",3,"배상책임보험 가입이 확인되지 않음"); if(staff>=5)add("liab",1);
  if(d.succ==="자녀 승계 예정")add("succ",3,"자녀 승계 예정"); else if(d.succ==="미정")add("succ",2,"후계 구도 미정"); if(d.loan!=="없음")add("succ",2,`가지급금 ${d.loan}`); if(bigSales)add("succ",1,`매출 ${d.sales}`);
  return DBD.needs.map(n=>{const o=out[n.k]||{s:0,r:[]}; return Object.assign({},n,{s:o.s,reasons:o.r,level:o.s>=6?"높음":o.s>=4?"중간":"낮음"});}).sort((a,b)=>b.s-a.s);
}
function corpDocs(d){
  const needs=corpScore(d), top=needs.slice(0,3), ind=DBD.industries.find(i=>i.name===d.ind)||{hook:""};
  const ceo=d.ceo?d.ceo+" 대표님":"대표님", missing=[]; if(!d.year)missing.push("설립연도"); if(!d.staff)missing.push("직원 수"); if(!d.age)missing.push("대표 나이"); if(!d.assets.length)missing.push("보유 자산");
  const prof=`${d.ind} · ${d.year?"설립 "+(new Date().getFullYear()-d.year)+"년차":"설립연도 미확인"} · 직원 ${d.staff||"미확인"}명 · 매출 ${d.sales} · 대표 ${d.ceo||"미확인"}${d.age?" ("+d.age+"세)":""}`;
  const qs=[top[0].q[0],top[1].q[0],top[2].q[0],"지금 회사에서 가장 신경 쓰이는 일은 무엇인가요?","보험이나 재무 관련해서 도움받는 전문가(세무사 등)가 있으세요?"];
  const brief=[
   {t:`${d.name} · 대표자 미팅 브리핑`,p:prof},
   {h:"오늘 미팅 목표",p:PURPOSE[d.purpose]},
   {h:"대표님이 관심 가질 만한 TOP 3",ul:top.map((n,i)=>`${i+1}. ${n.name} — ${n.reasons.length?n.reasons.join(", "):n.why}`)},
   {h:"미팅 오프닝 멘트",p:`${ceo}, 안녕하세요. ${S.set.fc}입니다. 바쁘신 중에 시간 내 주셔서 감사합니다. 오늘은 상품 말씀을 드리기보다, 회사 사정을 먼저 듣고 현재 보험 현황을 정리해 드리려고 찾아뵈었습니다.`,ul:["업종 이해 포인트: "+ind.hook]},
   {h:"대표님께 물어볼 질문 5가지",ul:qs.map((q,i)=>`${i+1}. ${q}`)},
   {h:"제안 순서 (첫 미팅의 목표는 현황 점검 일정 합의)",p:top.map((n,i)=>`${i+1}) ${n.name}`).join("  →  ")},
   {h:"준비물",ul:["이 브리핑 1페이지와 현황 점검표","명함, 회사 소개 자료","메모할 노트 (메모 70% / 제안 30%)"]},
   {h:"주의",ul:DBD.corp.rules.concat(missing.length?["입력되지 않은 정보(미팅에서 확인): "+missing.join(", ")]:[])}];
  const state=n=>{const m={ceo:"ceo",retire:"retire",group:"group",property:"property",liab:"liab"}[n.k];
    if(m)return d.has.includes(m)?"가입 확인됨(내용 점검 필요)":"가입 확인 안 됨";
    return `후계 구도: ${d.succ} / 가지급금: ${d.loan}`;};
  const prop=[
   {t:`${d.name} 법인 리스크 점검 제안서 (초안)`,p:`작성일 ${fmt(today())} · 작성 ${S.set.fc} · 대상 ${ceo}`},
   {h:"1. 회사 현황 요약",p:prof+(d.assets.length?` · 보유 자산: ${d.assets.join(", ")}`:"")+(d.memo?`\n참고: ${d.memo}`:"")},
   {h:"2. 점검 결과 (입력 정보 기준)",table:{head:["점검 항목","현재 상태","점검 필요도"],rows:needs.map(n=>[n.name,state(n),n.level])}},

  for(let i=0;i<q.length;i+=100){

    if(r.ok){chunk.forEach(l=>l.synced=true);continue;}
    if(r.status>=500||r.status===401)throw new Error("server");
    for(const l of chunk){const r2=await post([rowOf(l)]); if(r2.ok)l.synced=true; else if(r2.status>=500||r2.status===401)throw new Error("server"); else l.syncErr=true;}

  $("#modalBox").innerHTML=`<h2>${esc(f.name||f.emp_no)} <span class="small">${esc(f.team)} · 사번 ${esc(f.emp_no)}</span></h2>
   <p><span class="badge" style="background:#eee;color:${SEV[f.sev][1]}">${SEV[f.sev][0]}</span> ${admBadges(f)}</p>
   <div class="kpi"><div><b>${f.contacts}</b><span>접촉</span></div><div><b>${f.call_meet}</b><span>통화·미팅</span></div><div><b>${admPct(f.ok,f.contacts)}</b><span>응답률</span></div><div><b>${f.reports}</b><span>리포트</span></div><div><b>${f.links}</b><span>연결</span></div></div>
   <p class="small">활동일 ${f.active_days}일 · 마지막 기록 ${f.last_date?esc(f.last_date):"없음"} · 고객 ${f.stat_date?f.a_total+"명 (A 미접촉 "+f.a_untouched+"명)":"데이터 미등록"}</p>
   ${ms.length?`<b>코칭 제안</b>${ms.map((m,i)=>`<div class="msg">${esc(m)}</div><button class="b" onclick="copy(admModalMsgs[${i}])">📋 복사</button>`).join("")}`:`<p class="small">코칭이 필요한 항목이 없습니다.</p>`}
   <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="b" onclick="closeModal()">닫기</button></div>`;
  $("#modal").style.display="flex";
}
function admCsv(){
  const rows=[["상태","팀","이름","사번","접촉","통화·미팅","미팅","응답","리포트","연결","활동일","마지막기록","고객수","A미접촉"],...window.admFcs.map(f=>[SEV[f.sev][0],f.team,f.name,f.emp_no,f.contacts,f.call_meet,f.meetings,f.ok,f.reports,f.links,f.active_days,f.last_date||"",f.a_total,f.a_untouched])];
  download(`직원별현황_${fmt(today())}.csv`,rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n"),"text/csv");
}
VIEWS.admin=vAdmin2;

async function boot(){
  if(!SERVER){nav();render();return;}   // 서버 연결 정보가 없으면 기존 로컬 모드
  try{SESS=JSON.parse(localStorage.getItem(SESS_KEY)||"null");}catch(e){SESS=null;}
  if(!SESS){showLogin();return;}
  try{ if(await loadMe())await enter(); else showLogin(); }
  catch(e){ // 오프라인 시작: 저장된 프로필로 진입
    try{ME=JSON.parse(localStorage.getItem("fcapp.me")||"null");}catch(_){ME=null;}
    if(ME&&ME.id===SESS.uid)await enter(); else showLogin("서버에 연결할 수 없습니다.");
  }
}
boot();
</script>
