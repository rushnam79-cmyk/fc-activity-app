const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(S),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(V)},k,b(P));
  return new TextDecoder().decode(buf);
}
async function enter(pw,remember){
  const e=document.getElementById("err"),g=document.getElementById("go");
  e.textContent="";g.disabled=true;g.textContent="확인 중…";
  try{
    const html=await open(pw);
    try{(remember?localStorage:sessionStorage).setItem("fcapp.pw",pw);}catch(_){}
    document.open();document.write(html);document.close();
  }catch(_){
    g.disabled=false;g.textContent="들어가기";e.textContent="비밀번호가 맞지 않습니다.";
    try{localStorage.removeItem("fcapp.pw");sessionStorage.removeItem("fcapp.pw");}catch(_){}
  }
}
document.getElementById("f").addEventListener("submit",ev=>{ev.preventDefault();enter(document.getElementById("pw").value,document.getElementById("rem").checked);});
(function(){let s=null;try{s=localStorage.getItem("fcapp.pw")||sessionStorage.getItem("fcapp.pw");}catch(_){}
  if(!window.crypto||!crypto.subtle){document.getElementById("err").textContent="https 주소로 접속해야 합니다.";return;}

})();
